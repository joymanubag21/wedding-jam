<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join our Wedding Jam</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FDF9F3">

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ON THE WEDDING DAY, CHANGE THE LINE BELOW. NOTHING ELSE IN THIS FILE.

   1. Start the Jam in Spotify from the wedding playlist.
   2. Share  ->  Copy link.
   3. Paste it between the quotes below, replacing what is there.
   4. Commit and push. Every printed card already points here, so the
      cards never change.
   ═══════════════════════════════════════════════════════════════════════ */

const SPOTIFY_JAM_URL = "https://open.spotify.com/socialsession/0cFypbz17T5TKmXdoviWd1?si=ZAp3-JyHSHmQSiK1uoEOqw&utm_source=copy-link";
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;600&display=swap">
<style>
  /* The same ladder as every other page of this wedding: cream, Cormorant
     over Jost, one italic word in rose, one green button. display=swap, so
     the words are on screen before the fonts are - this page is usually gone
     in a blink and must never wait on a webfont to say anything. */
  :root{
    --bg:#FDF9F3; --ink:#2A2420; --ink-2:#5A5048; --ink-3:#9A8E82;
    --green:#4A6B4A; --rose:#C4785A; --line:rgba(196,120,90,.22); --line-2:rgba(196,120,90,.34);
    --r-lg:12px; --tr:.14em;
  }
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box }
  html,body{ margin:0; padding:0 }
  body{
    background:var(--bg); color:var(--ink); min-height:100svh;
    display:grid; place-items:center; padding:30px 24px;
    font-family:'Jost','Helvetica Neue',Arial,sans-serif; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .card{ width:100%; max-width:390px; text-align:center }

  h1{ margin:0 0 4px; font-weight:400; font-family:'Cormorant Garamond',Georgia,serif }
  h1 span{
    display:block; font-size:1.6rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink);
  }
  h1 em{ display:block; font-style:italic; font-size:2.7rem; line-height:1.05; color:var(--rose) }

  .lede{ margin:16px auto 26px; max-width:28ch; font-size:14.5px; color:var(--ink-2); line-height:1.55 }

  a.go{
    display:block; text-decoration:none; min-height:54px; line-height:54px;
    border-radius:var(--r-lg); background:var(--green); color:#fff;
    font-size:12px; font-weight:600; letter-spacing:var(--tr); text-transform:uppercase;
  }
  .fine{
    margin:14px 0 0; padding-top:12px; border-top:1px solid var(--line);
    font-size:11.5px; line-height:1.6; color:var(--ink-3);
  }
  .rule{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:24px }
  .rule i{ display:block; width:44px; height:1px; background:var(--line-2) }
  .rule span{
    font-size:10.5px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-3);
  }
</style>
</head>
<body>
  <div class="card">
    <h1><span>Join our</span><em>Wedding Jam</em></h1>
    <p class="lede">Add a song to our wedding soundtrack.</p>
    <a class="go" id="jam" href="#">Open Spotify Jam</a>
    <p class="fine">If Spotify did not open on its own, tap the button.</p>
    <div class="rule"><i></i><span>Joy &amp; Patrick</span><i></i></div>
  </div>

<script>
/* The button is wired before anything else happens, so the page a guest can
   fall back to is on screen and working whatever the redirect does next.
   Sending the browser away from inside <head> looked tidier and was wrong:
   the document was torn down before the body existed, so a blocked or slow
   redirect left a blank screen instead of this button. */
document.getElementById("jam").href = SPOTIFY_JAM_URL;

/* replace(), not assign(): Back should return the guest to wherever they came
   from, not bounce them into Spotify again. The pause is one paint, long
   enough that the fallback is already drawn underneath. */
setTimeout(function () { location.replace(SPOTIFY_JAM_URL); }, 150);
</script>
</body>
</html>
