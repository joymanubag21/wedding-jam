<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join our Wedding Jam</title>
<meta name="robots" content="noindex">

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ON THE WEDDING DAY, CHANGE THE LINE BELOW. NOTHING ELSE IN THIS FILE.

   1. Start the Jam in Spotify from the wedding playlist.
   2. Share  ->  Copy link.
   3. Paste it between the quotes below, replacing what is there.
   4. Commit and push. Every printed card already points here, so the
      cards never change.
   ═══════════════════════════════════════════════════════════════════════ */

const SPOTIFY_JAM_URL = "https://open.spotify.com/socialsession/0cFypbz17T5TKmXdoviWd1?si=ZAp3-JyHSHmQSiK1uoEOqw&utm_source=copy-link";
</script>

<style>
  /* No webfonts and no images on purpose: this page exists to be gone in a
     blink, often on a phone with one bar of reception at a reception. */
  :root{ --bg:#FDF9F3; --ink:#2A2420; --ink-2:#5A5048; --ink-3:#9A8E82;
         --green:#4A6B4A; --rose:#C4785A; --line:rgba(196,120,90,.22); }
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box }
  html,body{ margin:0; padding:0 }
  body{
    background:var(--bg); color:var(--ink); min-height:100svh;
    display:grid; place-items:center; padding:28px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .card{ width:100%; max-width:380px; text-align:center }
  .note{ font-size:34px; line-height:1; margin:0 0 18px }
  h1{ margin:0; font-size:1.6rem; font-weight:600; letter-spacing:-.01em }
  p{ margin:10px 0 26px; font-size:15px; color:var(--ink-2) }
  a.go{
    display:block; text-decoration:none; min-height:56px; line-height:56px;
    border-radius:12px; background:var(--green); color:#fff;
    font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  }
  .fine{
    margin:16px 0 0; padding-top:14px; border-top:1px solid var(--line);
    font-size:12px; color:var(--ink-3);
  }
  .names{ margin-top:22px; font-size:12px; letter-spacing:.16em;
          text-transform:uppercase; color:var(--rose) }
</style>
</head>
<body>
  <div class="card">
    <p class="note">&#127925;</p>
    <h1>Join our Wedding Jam</h1>
    <p>Add a song to our wedding soundtrack.</p>
    <a class="go" id="jam" href="#">Join Spotify Jam</a>
    <p class="fine">If Spotify did not open on its own, tap the button.</p>
    <p class="names">Joy &amp; Patrick &middot; 10 October 2026</p>
  </div>

<script>
/* The button is wired before anything else happens, so the page a guest can
   fall back to is on screen and working whatever the redirect does next.
   Sending the browser away from inside <head> looked tidier and was wrong:
   the document was torn down before the body existed, so a blocked or slow
   redirect left a blank screen instead of this button. */
document.getElementById("jam").href = SPOTIFY_JAM_URL;

/* replace(), not assign(): Back should return the guest to wherever they came
   from, not bounce them into Spotify again. The pause is one paint, long
   enough that the fallback is already drawn underneath. */
setTimeout(function () { location.replace(SPOTIFY_JAM_URL); }, 150);
</script>
</body>
</html>
